<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>PhishGuard - History</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div><h1>Analysis History</h1><p>Search past email analyses</p></div>
            <nav class="nav-links">
                <a href="index.html">Dashboard</a>
                <a href="scanner.html">Scanner</a>
                <a href="history.html" class="active">History</a> </nav>
        </div>
        <input type="text" id="search" placeholder="Search sender, subject, or content..." style="margin-bottom: 20px; width: 100%; box-sizing: border-box;" onkeyup="load()">
        
        <div class="table-responsive">
            <table style="width:100%; background:white; border-radius:12px; overflow:hidden; border-collapse:collapse; min-width: 600px;">
                <thead><tr style="background:#fafafa;"><th style="padding:15px; text-align:left;">Date</th><th style="padding:15px; text-align:left;">Subject / Sender</th><th style="padding:15px; text-align: left;">Verdict</th><th style="padding:15px; text-align:left;">Confidence</th></tr></thead>
                <tbody id="list"></tbody>
            </table>
        </div>
    </div>
    <script>
        async function load() {
            const search = document.getElementById('search').value;
            const res = await fetch(`/api/history?search=${search}`);
            const data = await res.json();
            document.getElementById('list').innerHTML = data.map(d => `
                <tr style="border-top:1px solid #eee;">
                    <td style="padding:15px;">${new Date(d.timestamp).toLocaleDateString()}</td>
                    <td style="padding:15px;"><strong>${d.subject || 'No Subject'}</strong><br><small>${d.sender}</small></td>
                    <td style="padding:15px;"><span class="badge ${d.analysisResult}">${d.analysisResult}</span></td>
                    <td style="padding:15px;">${d.mlConfidenceScore.toFixed(1)}%</td>
                </tr>`).join('');
        }
        window.onload = load;
    </script>
</body>
</html>
