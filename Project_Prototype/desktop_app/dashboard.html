<table>
    <thead><tr><th>Block #</th><th>Prev Hash</th><th>Scan Info</th></tr></thead>
    <tbody id="logTable"></tbody>
</table>
<script>
    async function loadLogs() {
        const res = await fetch('http://127.0.0.1:5000/dashboard_data');
        const logs = await res.json();
        document.getElementById('logTable').innerHTML = logs.map(b =>
            `<tr><td>${b.index}</td><td>${b.prev}</td><td>${JSON.stringify(b.data)}</td></tr>`
    ).join('');
    }
    setInterval(loadLogs, 3000); // Auto-refresh every 3 seconds
</script>
